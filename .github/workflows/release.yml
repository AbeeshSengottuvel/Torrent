name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4dd52b86c2caee9a7f34c2ee36d4f7ab30a7d526 # master
        with:
          toolchain: stable
          components: clippy

      - name: Run Core Security Verification
        run: |
          cargo check --workspace --tests
          python tools/check_no_telemetry.py

      - name: Package Desktop Windows Application
        working-directory: desktop
        run: |
          npm ci
          npm run package

      - name: Build Installers and Portable ZIP
        shell: pwsh
        run: |
          .\tools\build_windows_installer.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2b6f7564da72 # v4.4.3
        with:
          name: windows-release-artifacts
          path: |
            desktop/dist/Haven-Setup-*.exe
            desktop/dist/Haven-*-portable.zip
            desktop/dist/SHA256SUMS.txt

  draft-release:
    name: Create Draft GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    environment: release # Requires manual approval from 'release' environment before publishing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Windows Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: windows-release-artifacts
          path: release-assets

      - name: Generate Combined SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          draft: true # Draft release: Maintainer must review, sign manifest offline, and approve publish
          prerelease: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
