name: Build and Release Haven (PC & Mobile)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-rust-core:
    name: Test Rust Core & Security Invariants
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Backend Security Tests
        run: |
          cd core
          cargo test --workspace --verbose

  build-desktop-pc:
    name: Package Physical Desktop Application (Windows .exe)
    runs-on: windows-latest
    needs: test-rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Package Windows Binary
        run: |
          cd desktop
          npm install
          npm run package

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/dist/Haven-win32-x64/* -DestinationPath Haven-Windows-x64.zip

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Haven-Windows-x64
          path: Haven-Windows-x64.zip

  create-github-release:
    name: Publish Release to GitHub
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-desktop-pc]
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Haven-Windows-x64
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Haven-Windows-x64.zip
          name: "Haven ${{ github.ref_name }}"
          body_path: version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
