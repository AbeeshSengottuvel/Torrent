[package]
name = "haven-sign"
version = "0.1.0"
edition = "2021"
authors = ["Haven Contributors"]
license = "MPL-2.0"
description = "Offline Ed25519 signing tool for Haven update manifests (Section 39.2)"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[lints.rust]
unsafe_code = "forbid"
